name: Browser BGP checks

on:
  pull_request:
    paths:
      - 'lib/bgp/**'
      - 'lib/bgp-client.ts'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/bgp-checks.yml'
  push:
    branches: [main]
    paths:
      - 'lib/bgp/**'
      - 'lib/bgp-client.ts'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/bgp-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Stream decoding, browser queries and stateless relay (no upstream downloads)
        run: node --test tests/bgp/*.test.mjs tests/worker/*.test.mjs
