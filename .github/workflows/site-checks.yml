name: Website build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked website dependencies
        run: pnpm install --frozen-lockfile
      - name: Test query and upload routing inside the website Worker
        run: node --test tests/worker/routing.test.mjs
      - name: Test publisher with a local R2 binding
        run: pnpm run bgp:publisher:test
      - name: Build and check the single Worker from the root deployment config
        run: pnpm exec wrangler deploy --dry-run
