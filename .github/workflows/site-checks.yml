name: Website checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked website dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, types, browser data lifecycle and path rendering
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test:functional
      - name: Build and check deployment without database or object storage
        run: pnpm exec wrangler deploy --dry-run
      - name: Exercise the production browser Worker bundle
        run: pnpm run test:worker
      - name: Install Chromium for local browser checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Test the local production site with synthetic BGP data
        run: pnpm run test:e2e
      - name: Save browser screenshots and failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
